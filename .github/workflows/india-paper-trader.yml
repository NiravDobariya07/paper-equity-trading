# NSE paper trader. Strategy code stays on main; config.json, EQUITY_L.csv, state.json,
# liquid-*.json and paper_trades.xlsx live on the data branch at trader/india.
#
# GitHub's schedule fires hours late or not at all, so the trader does not rely on it:
# every `run` job uses --follow. It trades the day, prepares the next day's stock list at
# 15:50 IST, then waits; after 320 minutes it starts a fresh job (the hand-off step), so a
# chain of jobs is always running and the morning one is awake at 08:45 IST. The schedules
# below are only a backup that (re)starts the chain if it ever breaks; while it runs they
# queue behind it, and GitHub cancels the extra queued ones (shown as "cancelled").
# To stop the trader: Actions -> India paper trader -> ... -> Disable workflow.
#
# For ChatGPT-assisted manual triggering, open an issue titled exactly
# [paper-trader:prepare] or [paper-trader:run]. Only the repository owner can trigger.
# The india-data concurrency group serializes every writer to the shared data branch.
name: India paper trader

on:
  schedule:
    - cron: "0 3 * * 1-5"     # 08:30 IST: backup start of the chain
    - cron: "30 3 * * 1-5"    # 09:00 IST: backup
    - cron: "0 4 * * 1-5"     # 09:30 IST: backup
    - cron: "16 10 * * 1-5"   # 15:46 IST: backup (prepares the next list, then waits)
  workflow_dispatch:
    inputs:
      command:
        description: Command to run
        type: choice
        options: [run, prepare, report]
        default: report
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  issues: write              # acknowledge ChatGPT-issued trigger requests

concurrency:
  group: india-data
  cancel-in-progress: false

jobs:
  trade:
    # Issue-based requests are accepted only from the repository owner and only
    # for the two exact command titles. Scheduled/manual dispatch behaviour remains.
    if: >-
      github.event_name != 'issues' ||
      (github.actor == github.repository_owner &&
       (github.event.issue.title == '[paper-trader:prepare]' ||
        github.event.issue.title == '[paper-trader:run]'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Pick the command
        id: cmd
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          DISPATCH_COMMAND: ${{ inputs.command }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            command="$DISPATCH_COMMAND"
          elif [ "$EVENT_NAME" = "issues" ]; then
            case "$ISSUE_TITLE" in
              "[paper-trader:prepare]") command="prepare" ;;
              "[paper-trader:run]") command="run" ;;
              *) echo "Unsupported issue trigger title" >&2; exit 1 ;;
            esac
          else
            command="run"     # every schedule: run --follow prepares the next list itself
          fi
          echo "name=$command" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4   # india/tm.py runs its Time Machine simulator
        with:
          repository: Jakeschincariol/day-trader-skill
          ref: 3d0f4ef6986f4984b7c6bd46f7ff4f87744c3abd
          path: day-trader-skill

      - uses: actions/checkout@v4
        with:
          ref: data
          path: trader/india

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r india/requirements.txt

      - name: Git identity for the data branch
        working-directory: trader/india
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - name: python3 india/paper_trader.py ${{ steps.cmd.outputs.name }}
        id: trade
        timeout-minutes: 350
        env:
          PYTHONUNBUFFERED: "1"
          CMD: ${{ steps.cmd.outputs.name }}
        run: |
          set +e
          args=""
          if [ "$CMD" = run ]; then
            args="--max-minutes 320 --follow"
            .github/scripts/sync-loop.sh &
          fi
          python3 india/paper_trader.py $CMD $args 2>&1 | tee "$RUNNER_TEMP/out.txt"
          code=${PIPESTATUS[0]}
          if [ "$code" = 75 ]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
            code=0
          fi
          exit $code

      - name: Summary
        if: always()
        run: |
          python3 india/paper_trader.py report > "$RUNNER_TEMP/report.txt" 2>&1 || true
          { echo '```'; tail -n 40 "$RUNNER_TEMP/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save data to the data branch
        if: always()
        run: |
          pkill -f sync-loop.sh || true
          while pgrep -f save-data.sh > /dev/null; do sleep 2; done
          .github/scripts/save-data.sh "${{ steps.cmd.outputs.name }} $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"

      - name: Hand off to a fresh run job
        if: always() && steps.trade.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run india-paper-trader.yml --repo "${{ github.repository }}" --ref main -f command=run

      - name: Report ChatGPT trigger result on the issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          COMMAND: ${{ steps.cmd.outputs.name }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --body "Paper-trader command: `$COMMAND`\nWorkflow result: **$JOB_STATUS**\nRun: $RUN_URL"
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-${{ github.run_id }}
          path: |
            trader/india/paper_trades.xlsx
            trader/india/state.json
          if-no-files-found: ignore
          retention-days: 30
