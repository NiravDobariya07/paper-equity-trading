# NSE paper trader on a schedule. Code comes from main; config.json, EQUITY_L.csv,
# state.json, liquid-*.json and paper_trades.xlsx live on the `data` branch, checked
# out at trader/india and committed back every 15 minutes and after every job.
#
# The primary morning trigger is 08:30 IST. 09:00 and 09:30 are fallback starts in
# case GitHub delays or drops a scheduled event. The workflow concurrency group keeps
# data-branch writes serialized. A run stops after 320 minutes and hands off if needed.
name: India paper trader

on:
  schedule:
    - cron: "0 3 * * 1-5"     # 08:30 IST: primary run (waits for the 09:30 opening range)
    - cron: "30 3 * * 1-5"    # 09:00 IST: fallback run
    - cron: "0 4 * * 1-5"     # 09:30 IST: fallback run
    - cron: "45 10 * * 1-5"   # 16:15 IST: prepare the next trading day's stock list
  workflow_dispatch:
    inputs:
      command:
        description: Command to run
        type: choice
        options: [run, prepare, report]
        default: report

permissions:
  contents: write
  actions: write              # the hand-off starts the next run job

concurrency:
  group: india-data           # one job at a time writes the data branch
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Pick the command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 10 * * 1-5" ]; then
            echo "name=prepare" >> "$GITHUB_OUTPUT"
          else
            echo "name=run" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4   # india/tm.py runs its Time Machine simulator
        with:
          repository: Jakeschincariol/day-trader-skill
          ref: 3d0f4ef6986f4984b7c6bd46f7ff4f87744c3abd
          path: day-trader-skill

      - uses: actions/checkout@v4
        with:
          ref: data
          path: trader/india

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r india/requirements.txt

      - name: Git identity for the data branch
        working-directory: trader/india
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - name: python3 india/paper_trader.py ${{ steps.cmd.outputs.name }}
        id: trade
        timeout-minutes: 350
        env:
          PYTHONUNBUFFERED: "1"
          CMD: ${{ steps.cmd.outputs.name }}
        run: |
          set +e
          args=""
          if [ "$CMD" = run ]; then
            args="--max-minutes 320"
            .github/scripts/sync-loop.sh &
          fi
          python3 india/paper_trader.py $CMD $args 2>&1 | tee "$RUNNER_TEMP/out.txt"
          code=${PIPESTATUS[0]}
          if [ "$code" = 75 ]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
            code=0
          fi
          exit $code

      - name: Summary
        if: always()
        run: |
          python3 india/paper_trader.py report > "$RUNNER_TEMP/report.txt" 2>&1 || true
          { echo '```'; tail -n 40 "$RUNNER_TEMP/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save data to the data branch
        if: always()
        run: |
          pkill -f sync-loop.sh || true
          while pgrep -f save-data.sh > /dev/null; do sleep 2; done   # let a save in progress finish
          .github/scripts/save-data.sh "${{ steps.cmd.outputs.name }} $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"

      - name: Hand off to a fresh run job
        if: always() && steps.trade.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run india-paper-trader.yml --repo "${{ github.repository }}" --ref main -f command=run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-${{ github.run_id }}
          path: |
            trader/india/paper_trades.xlsx
            trader/india/state.json
          if-no-files-found: ignore
          retention-days: 30
